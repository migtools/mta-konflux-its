---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: mta-ui-tests-on-multicloud
  namespace: art-mta-tenant
spec:
  application: fbc-mta-8-3
  contexts:
    - name: application
      description: MTA tier0 multicloud tests (parallel execution on ARO and ROSA)
  params:
    - name: clusterTypes
      value:
        - "aro"
        - "rosa"
    - name: uiTestBranch
      value: ""  # Auto-detect from MTA version (8.3 → release-0.11)
  resolverRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/migtools/mta-konflux-its
      - name: revision
        value: main
      - name: pathInRepo
        value: pipelines/multicloud/mta-tier0-pipeline.yaml
