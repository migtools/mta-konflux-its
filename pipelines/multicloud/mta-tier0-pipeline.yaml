apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mta-multicloud-tier0-pipeline
spec:
  description: |
    MTA Tier-0 UI Tests on Multicloud Platforms

    Provisions fresh cluster (ARO/ROSA/ROSA-STS/OCP-AWS), deploys MTA operator
    from Konflux snapshot, runs tier-0 UI tests, and destroys the cluster.

  params:
    - name: SNAPSHOT
      description: Application Snapshot JSON (provided by ITS)
      type: string
    - name: clusterType
      description: Cluster type (aro, rosa, rosa-sts, ocp-aws)
      type: string
      default: "aro"
    - name: uiTestBranch
      description: Branch of mta-tackle2-ui to use for tier0 tests (auto-detected from MTA version if empty)
      type: string
      default: ""

  results:
    - name: OPERATOR_NVR
      description: Operator NVR tested
      value: $(tasks.extract-operator-nvr.results.operatorNVR)
    - name: CLUSTER_ID
      description: Cluster ID
      value: $(tasks.provision-cluster.results.clusterId)
    - name: DEPLOYMENT_STATUS
      description: Operator deployment status
      value: $(tasks.deploy-operator.results.deploymentStatus)
    - name: TEST_STATUS
      description: Tier-0 test result
      value: $(tasks.run-tier0-tests.results.testStatus)

  tasks:
    # Parse snapshot metadata (extracts FBC component image)
    - name: parse-metadata
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: a1a70b0a1cfc96f5216d472fbd60f6b42780b3e5
          - name: pathInRepo
            value: tasks/test_metadata.yaml

    # Filter by OCP version - only allow tier0 tests on 4.22
    - name: filter-ocp-version
      runAfter:
        - parse-metadata
      params:
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: allowedOcpVersions
          value: "4.22"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/filter-ocp-version.yaml

    # Extract operator NVR for reporting
    - name: extract-operator-nvr
      runAfter:
        - filter-ocp-version
      params:
        - name: snapshotJson
          value: $(params.SNAPSHOT)
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/extract-operator-nvr.yaml

    # Determine test branch (use parameter if provided, otherwise auto-detect from MTA version)
    - name: map-test-branch
      runAfter:
        - parse-metadata
      params:
        - name: snapshotJson
          value: $(params.SNAPSHOT)
        - name: uiTestBranch
          value: $(params.uiTestBranch)
      taskSpec:
        params:
          - name: snapshotJson
            type: string
          - name: uiTestBranch
            type: string
        results:
          - name: testBranch
        steps:
          - name: extract-and-map
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              UI_TEST_BRANCH='$(params.uiTestBranch)'

              # If branch explicitly provided, use it
              if [ -n "$UI_TEST_BRANCH" ]; then
                echo "Using explicitly provided test branch: $UI_TEST_BRANCH"
                echo -n "$UI_TEST_BRANCH" > $(results.testBranch.path)
                exit 0
              fi

              # Otherwise, auto-detect from snapshot
              echo "Auto-detecting test branch from MTA version..."
              SNAPSHOT='$(params.snapshotJson)'

              # Extract application name (e.g., fbc-mta-8-3)
              APP_NAME=$(echo "$SNAPSHOT" | grep -o '"application":"[^"]*"' | cut -d'"' -f4)
              echo "Application: $APP_NAME"

              # Extract version (fbc-mta-8-3 → 8.3)
              VERSION=$(echo "$APP_NAME" | grep -oE '[0-9]+-[0-9]+' | tr '-' '.')
              echo "MTA version: $VERSION"

              # Map to test branch
              case "$VERSION" in
                8.0) BRANCH="release-0.8" ;;
                8.1) BRANCH="release-0.9" ;;
                8.2) BRANCH="release-0.10" ;;
                8.3) BRANCH="release-0.11" ;;
                *)
                  echo "ERROR: No test branch mapping for version $VERSION"
                  exit 1
                  ;;
              esac

              echo "Mapped to test branch: $BRANCH"
              echo -n "$BRANCH" > $(results.testBranch.path)

    # Map cluster configuration (profile, region, timeout)
    - name: map-cluster-config
      params:
        - name: clusterType
          value: $(params.clusterType)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/multicloud/map-cluster-profile.yaml

    # Provision fresh cluster via OCPCTL
    - name: provision-cluster
      runAfter:
        - extract-operator-nvr
        - map-cluster-config
      params:
        - name: clusterName
          value: $(context.pipelineRun.name)
        - name: profile
          value: $(tasks.map-cluster-config.results.profile)
        - name: platform
          value: $(tasks.map-cluster-config.results.platform)
        - name: clusterType
          value: $(tasks.map-cluster-config.results.clusterType)
        - name: version
          value: $(tasks.map-cluster-config.results.version)
        - name: region
          value: $(tasks.map-cluster-config.results.region)
        - name: waitTimeout
          value: $(tasks.map-cluster-config.results.waitTimeout)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/multicloud/ocpctl-provision.yaml

    # Deploy MTA operator (uses multicloud task for ROSA/ARO)
    - name: deploy-operator
      runAfter:
        - provision-cluster
      when:
        - input: "$(tasks.provision-cluster.results.provisionStatus)"
          operator: in
          values: ["READY"]
      params:
        - name: clusterId
          value: $(tasks.provision-cluster.results.clusterId)
        - name: fbcImage
          value: $(tasks.parse-metadata.results.component-container-image)
        - name: snapshotJson
          value: $(params.SNAPSHOT)
        - name: configureRegistryMirror
          value: "true"  # IDMS setup for stage registry mirrors
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/multicloud/deploy-mta-operator-multicloud.yaml

    # Run tier-0 UI tests
    - name: run-tier0-tests
      runAfter:
        - deploy-operator
      params:
        - name: uiRoute
          value: $(tasks.deploy-operator.results.uiRoute)
        - name: testTags
          value: "@tier0"
        - name: gitBranch
          value: $(tasks.map-test-branch.results.testBranch)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/run-ui-e2e-tests.yaml

  finally:
    # Destroy cluster after tests complete
    - name: destroy-cluster
      when:
        - input: "$(tasks.provision-cluster.status)"
          operator: in
          values: ["Succeeded"]
      params:
        - name: clusterId
          value: $(tasks.provision-cluster.results.clusterId)
        - name: clusterName
          value: $(tasks.provision-cluster.results.clusterName)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/ocpctl-cleanup.yaml

    # Send Slack notification
    - name: send-slack-notification
      when:
        - input: "$(tasks.run-tier0-tests.status)"
          operator: in
          values: ["Succeeded", "Failed", "None"]
      params:
        - name: testStatus
          value: $(tasks.run-tier0-tests.status)
        - name: clusterType
          value: $(params.clusterType)
        - name: clusterTypeLabel
          value: $(tasks.map-cluster-config.results.clusterTypeLabel)
        - name: snapshotName
          value: $(tasks.parse-metadata.results.application-name)
        - name: operatorNVR
          value: $(tasks.extract-operator-nvr.results.operatorNVR)
        - name: clusterId
          value: $(tasks.provision-cluster.results.clusterId)
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: triggeredBy
          value: "its"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/multicloud/slack-notification-tier0.yaml
