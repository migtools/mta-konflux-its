apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: mta-multicloud-tier0-pipeline
spec:
  description: |
    MTA Tier-0 UI Tests on Multicloud Platforms

    Provisions fresh cluster (ARO/ROSA/ROSA-STS/OCP-AWS), deploys MTA operator
    from Konflux snapshot, runs tier-0 UI tests, and destroys the cluster.

  params:
    - name: SNAPSHOT
      description: Application Snapshot JSON (provided by ITS)
      type: string
    - name: clusterType
      description: Cluster types to test (comma-separated for parallel execution, e.g., "rosa,aro")
      type: string
      default: "aro"
    - name: uiTestBranch
      description: Branch of mta-tackle2-ui to use for tier0 tests (auto-detected from MTA version if empty)
      type: string
      default: ""
    - name: existingClusterId
      description: Use existing cluster instead of provisioning (for debugging) - leave empty to provision new cluster
      type: string
      default: ""

  results:
    - name: OPERATOR_NVR
      description: Operator NVR tested
      value: $(tasks.extract-operator-nvr.results.operatorNVR)
    - name: CLUSTER_IDS
      description: Cluster IDs (array - one per cluster type)
      value: $(tasks.provision-cluster.results.clusterId[*])
    - name: DEPLOYMENT_STATUSES
      description: Operator deployment statuses (array - one per cluster type)
      value: $(tasks.deploy-operator.results.deploymentStatus[*])
    - name: TEST_STATUSES
      description: Tier-0 test results (array - one per cluster type)
      value: $(tasks.run-tier0-tests.results.testStatus[*])

  tasks:
    # Extract FBC image from snapshot (doesn't require component label)
    - name: extract-fbc-image
      params:
        - name: snapshotJson
          value: $(params.SNAPSHOT)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: tier0-matrix-execution
          - name: pathInRepo
            value: tasks/extract-fbc-image.yaml

    # Filter by OCP version - only allow tier0 tests on 4.22
    - name: filter-ocp-version
      runAfter:
        - extract-fbc-image
      params:
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: allowedOcpVersions
          value: "4.22"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: tier0-matrix-execution
          - name: pathInRepo
            value: tasks/filter-ocp-version.yaml

    # Extract operator NVR for reporting
    - name: extract-operator-nvr
      runAfter:
        - filter-ocp-version
      params:
        - name: snapshotJson
          value: $(params.SNAPSHOT)
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: tier0-matrix-execution
          - name: pathInRepo
            value: tasks/extract-operator-nvr.yaml

    # Parse cluster types into array for matrix execution
    - name: parse-cluster-types
      params:
        - name: clusterTypeString
          value: $(params.clusterType)
      taskSpec:
        params:
          - name: clusterTypeString
            type: string
        results:
          - name: clusterTypes
            type: array
        steps:
          - name: parse
            image: registry.access.redhat.com/ubi9/ubi:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              TYPES='$(params.clusterTypeString)'
              echo "Parsing cluster types: $TYPES"

              # Convert comma-separated to JSON array
              # Tekton requires array results in JSON format
              python3 -c "import sys, json; print(json.dumps('$TYPES'.split(',')))" > $(results.clusterTypes.path)

              echo "Cluster types for parallel execution (JSON array):"
              cat $(results.clusterTypes.path)

    # Determine test branch (use parameter if provided, otherwise auto-detect from MTA version)
    - name: map-test-branch
      runAfter:
        - extract-fbc-image
      params:
        - name: snapshotJson
          value: $(params.SNAPSHOT)
        - name: uiTestBranch
          value: $(params.uiTestBranch)
      taskSpec:
        params:
          - name: snapshotJson
            type: string
          - name: uiTestBranch
            type: string
        results:
          - name: testBranch
        steps:
          - name: extract-and-map
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              UI_TEST_BRANCH='$(params.uiTestBranch)'

              # If branch explicitly provided, use it
              if [ -n "$UI_TEST_BRANCH" ]; then
                echo "Using explicitly provided test branch: $UI_TEST_BRANCH"
                echo -n "$UI_TEST_BRANCH" > $(results.testBranch.path)
                exit 0
              fi

              # Otherwise, auto-detect from snapshot
              echo "Auto-detecting test branch from MTA version..."
              SNAPSHOT='$(params.snapshotJson)'

              # Extract application name (e.g., fbc-mta-8-3)
              APP_NAME=$(echo "$SNAPSHOT" | grep -o '"application":"[^"]*"' | cut -d'"' -f4)
              echo "Application: $APP_NAME"

              # Extract version (fbc-mta-8-3 → 8.3)
              VERSION=$(echo "$APP_NAME" | grep -oE '[0-9]+-[0-9]+' | tr '-' '.')
              echo "MTA version: $VERSION"

              # Map to test branch
              case "$VERSION" in
                8.0) BRANCH="release-0.8" ;;
                8.1) BRANCH="release-0.9" ;;
                8.2) BRANCH="release-0.10" ;;
                8.3) BRANCH="release-0.11" ;;
                *)
                  echo "ERROR: No test branch mapping for version $VERSION"
                  exit 1
                  ;;
              esac

              echo "Mapped to test branch: $BRANCH"
              echo -n "$BRANCH" > $(results.testBranch.path)

    # Map cluster configuration (profile, region, timeout) - runs for each cluster type
    - name: map-cluster-config
      runAfter:
        - parse-cluster-types
      matrix:
        params:
          - name: clusterType
            value: $(tasks.parse-cluster-types.results.clusterTypes[*])
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: tier0-matrix-execution
          - name: pathInRepo
            value: tasks/multicloud/map-cluster-profile.yaml

    # Provision fresh clusters via OCPCTL - runs in parallel for each cluster type
    - name: provision-cluster
      runAfter:
        - extract-operator-nvr
        - map-cluster-config
      matrix:
        params:
          - name: clusterType
            value: $(tasks.parse-cluster-types.results.clusterTypes[*])
      params:
        - name: clusterName
          value: $(context.pipelineRun.name)
        - name: profile
          value: $(tasks.map-cluster-config.results.profile[*])
        - name: platform
          value: $(tasks.map-cluster-config.results.platform[*])
        - name: version
          value: $(tasks.map-cluster-config.results.version[*])
        - name: region
          value: $(tasks.map-cluster-config.results.region[*])
        - name: waitTimeout
          value: $(tasks.map-cluster-config.results.waitTimeout[*])
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: tier0-matrix-execution
          - name: pathInRepo
            value: tasks/multicloud/ocpctl-provision.yaml

    # Deploy MTA operator (uses multicloud task for ROSA/ARO) - runs in parallel for each cluster
    - name: deploy-operator
      runAfter:
        - provision-cluster
      matrix:
        params:
          - name: clusterType
            value: $(tasks.parse-cluster-types.results.clusterTypes[*])
      when:
        - input: "$(tasks.provision-cluster.results.provisionStatus[*])"
          operator: in
          values: ["READY"]
      params:
        - name: clusterId
          value: $(tasks.provision-cluster.results.clusterId[*])
        - name: fbcImage
          value: $(tasks.extract-fbc-image.results.fbcImage)
        - name: snapshotJson
          value: $(params.SNAPSHOT)
        - name: configureRegistryMirror
          value: "true"  # IDMS setup for stage registry mirrors
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: tier0-matrix-execution
          - name: pathInRepo
            value: tasks/multicloud/deploy-mta-operator-multicloud.yaml

    # Run tier-0 UI tests - runs in parallel for each cluster
    - name: run-tier0-tests
      runAfter:
        - deploy-operator
      matrix:
        params:
          - name: clusterType
            value: $(tasks.parse-cluster-types.results.clusterTypes[*])
      params:
        - name: uiRoute
          value: $(tasks.deploy-operator.results.uiRoute[*])
        - name: testTags
          value: "@tier0"
        - name: gitBranch
          value: $(tasks.map-test-branch.results.testBranch)
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: tier0-matrix-execution
          - name: pathInRepo
            value: tasks/run-ui-e2e-tests.yaml

  finally:
    # Destroy clusters after tests complete - runs for each cluster
    - name: destroy-cluster
      matrix:
        params:
          - name: clusterType
            value: $(tasks.parse-cluster-types.results.clusterTypes[*])
      when:
        - input: "$(tasks.provision-cluster.status[*])"
          operator: in
          values: ["Succeeded"]
        - input: "$(params.existingClusterId)"
          operator: in
          values: [""]
      params:
        - name: clusterId
          value: $(tasks.provision-cluster.results.clusterId[*])
        - name: clusterName
          value: $(tasks.provision-cluster.results.clusterName[*])
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: tier0-matrix-execution
          - name: pathInRepo
            value: tasks/ocpctl-cleanup.yaml

    # Send Slack notifications - one per cluster
    - name: send-slack-notification
      matrix:
        params:
          - name: clusterType
            value: $(tasks.parse-cluster-types.results.clusterTypes[*])
      when:
        - input: "$(tasks.run-tier0-tests.status[*])"
          operator: in
          values: ["Succeeded", "Failed", "None"]
      params:
        - name: clusterTypeLabel
          value: $(tasks.map-cluster-config.results.clusterTypeLabel[*])
        - name: testStatus
          value: $(tasks.run-tier0-tests.status[*])
        - name: clusterId
          value: $(tasks.provision-cluster.results.clusterId[*])
        - name: snapshotName
          value: $(tasks.extract-fbc-image.results.applicationName)
        - name: operatorNVR
          value: $(tasks.extract-operator-nvr.results.operatorNVR)
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: triggeredBy
          value: "its"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/migtools/mta-konflux-its
          - name: revision
            value: tier0-matrix-execution
          - name: pathInRepo
            value: tasks/multicloud/slack-notification-tier0.yaml
