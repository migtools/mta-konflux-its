apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-notify
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Cleanup
    tekton.dev/tags: cleanup,notification,finally
    tekton.dev/displayName: "Cleanup and Notify"
spec:
  description: >-
    Finally task that releases the cluster and sends Slack notification
    with all test results.

  params:
    # Cluster release params
    - name: clusterId
      type: string
      description: UUID of the cluster to release
    - name: ocpctlUrl
      type: string
      default: "https://ocpctl.mg.dog8code.com/api/v1"
      description: OCPCTL API base URL
    - name: ocpctlSecretName
      type: string
      default: "ocpctl-ci-key"
      description: Name of the Kubernetes Secret containing the OCPCTL API key

    # Slack notification params
    - name: testStatus
      type: string
      description: UI E2E test execution status (Succeeded/Failed/Skipped)
    - name: dastStatus
      type: string
      default: "None"
      description: DAST scan execution status (Succeeded/Failed/Skipped/None)
    - name: koncurStatus
      type: string
      default: "None"
      description: Koncur test execution status (Succeeded/Failed/Skipped/None)
    - name: operatorNVR
      type: string
      default: "unknown"
      description: Operator NVR (Name-Version-Release)
    - name: snapshotJson
      type: string
      description: Konflux snapshot JSON
    - name: pipelineRunName
      type: string
      description: Name of the pipeline run
    - name: testBranch
      type: string
      default: "main"
      description: Branch used for UI E2E tests
    - name: slackWebhookSecretName
      type: string
      default: "slack-webhook"
      description: Name of the Kubernetes Secret containing Slack webhook URL
    - name: slackWebhookSecretKey
      type: string
      default: "url"
      description: Key in the secret containing the webhook URL
    - name: sendSlack
      type: string
      default: "run"
      description: Set to "skip" to disable Slack notifications

  results:
    - name: releaseStatus
      description: Cluster release status (SUCCESS/FAILED)
    - name: slackStatus
      description: Slack notification status (SENT/FAILED/SKIPPED)

  stepTemplate:
    computeResources:
      requests:
        memory: 2Gi
        cpu: "1"
      limits:
        memory: 4Gi
        cpu: "2"

  steps:
    # Step 1: Release cluster
    - name: release-cluster
      image: registry.access.redhat.com/ubi9/ubi:9.5
      env:
        - name: OCPCTL_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.ocpctlSecretName)
              key: api-key
      script: |
        #!/bin/bash
        set -euo pipefail

        echo ""
        echo "=========================================="
        echo "STEP 1: Releasing Cluster"
        echo "=========================================="

        OCPCTL_URL="$(params.ocpctlUrl)"
        CLUSTER_ID="$(params.clusterId)"

        echo "Releasing cluster back to pool: $CLUSTER_ID"

        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST "$OCPCTL_URL/pools/clusters/$CLUSTER_ID/release" \
          -H "Authorization: Bearer $OCPCTL_API_KEY" \
          -H "Content-Type: application/json")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
          echo "⚠️ Cluster release request failed (HTTP $HTTP_CODE)"
          echo "$BODY"
          echo "FAILED" > $(results.releaseStatus.path)
          # Don't exit - continue to Slack notification
        else
          echo "✅ Cluster released successfully to pool"
          echo "SUCCESS" > $(results.releaseStatus.path)
        fi

    # Step 2: Send Slack notification
    - name: send-slack-notification
      image: registry.access.redhat.com/ubi9/ubi:9.5
      env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: $(params.slackWebhookSecretName)
              key: $(params.slackWebhookSecretKey)
      script: |
        #!/bin/bash
        set -euo pipefail

        SEND_SLACK="$(params.sendSlack)"

        if [ "$SEND_SLACK" != "run" ]; then
          echo "Slack notification skipped (sendSlack != run)"
          echo "SKIPPED" > $(results.slackStatus.path)
          exit 0
        fi

        echo ""
        echo "=========================================="
        echo "STEP 2: Sending Slack Notification"
        echo "=========================================="

        UI_TEST_STATUS="$(params.testStatus)"
        DAST_STATUS="$(params.dastStatus)"
        KONCUR_STATUS="$(params.koncurStatus)"
        OPERATOR_NVR="$(params.operatorNVR)"
        SNAPSHOT_JSON='$(params.snapshotJson)'
        PIPELINE_RUN="$(params.pipelineRunName)"
        TEST_BRANCH="$(params.testBranch)"

        # Install oc and jq
        if ! command -v oc &> /dev/null; then
          echo "Installing oc CLI..."
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz | tar -xzf - -C /usr/local/bin oc
          chmod +x /usr/local/bin/oc
        fi

        if ! command -v jq &> /dev/null; then
          echo "Installing jq..."
          curl -sL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o /usr/local/bin/jq
          chmod +x /usr/local/bin/jq
        fi

        # Extract snapshot name from pipelineRun label
        SNAPSHOT_NAME=$(oc get pipelinerun "$PIPELINE_RUN" -o jsonpath='{.metadata.labels.appstudio\.openshift\.io/snapshot}' 2>/dev/null || true)

        # Fallback: use application name
        if [ -z "$SNAPSHOT_NAME" ]; then
          SNAPSHOT_NAME=$(echo "$SNAPSHOT_JSON" | grep -o '"application":"[^"]*"' | cut -d'"' -f4)
        fi

        # Last resort
        if [ -z "$SNAPSHOT_NAME" ]; then
          SNAPSHOT_NAME="unknown"
        fi

        # Extract application name from snapshot JSON for dynamic Konflux link
        APPLICATION_NAME=$(echo "$SNAPSHOT_JSON" | grep -o '"application":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$APPLICATION_NAME" ]; then
          APPLICATION_NAME="unknown"
        fi

        # Extract OCP version from snapshot target_branch annotation
        OCP_VERSION="N/A"
        if [ "$SNAPSHOT_NAME" != "unknown" ]; then
          TARGET_BRANCH=$(oc get snapshot "$SNAPSHOT_NAME" \
            -o jsonpath='{.metadata.annotations.build\.appstudio\.redhat\.com/target_branch}' 2>/dev/null || echo "")

          if [ -n "$TARGET_BRANCH" ]; then
            if echo "$TARGET_BRANCH" | grep -qE 'ocp-[0-9]+\.[0-9]+'; then
              OCP_VERSION=$(echo "$TARGET_BRANCH" | grep -oE 'ocp-[0-9]+\.[0-9]+' | sed 's/ocp-//')
            fi
          fi
        fi

        echo "Snapshot: $SNAPSHOT_NAME"
        echo "Operator NVR: $OPERATOR_NVR"
        echo "OCP Version: $OCP_VERSION"
        echo "UI Tests: $UI_TEST_STATUS"
        echo "DAST Scan: $DAST_STATUS"
        echo "Koncur Tests: $KONCUR_STATUS"

        # UI test status - emoji for pass/fail, text for skipped
        if [ "$UI_TEST_STATUS" = "Succeeded" ]; then
          UI_STATUS_TEXT=":white_check_mark:"
        elif [ "$UI_TEST_STATUS" = "Failed" ]; then
          UI_STATUS_TEXT=":x:"
        else
          UI_STATUS_TEXT="SKIPPED"
        fi

        # DAST status
        if [ "$DAST_STATUS" = "Succeeded" ]; then
          DAST_STATUS_TEXT=":white_check_mark:"
        elif [ "$DAST_STATUS" = "Failed" ]; then
          DAST_STATUS_TEXT=":x:"
        else
          DAST_STATUS_TEXT="SKIPPED"
        fi

        # Koncur test status
        if [ "$KONCUR_STATUS" = "Succeeded" ]; then
          KONCUR_STATUS_TEXT=":white_check_mark:"
        elif [ "$KONCUR_STATUS" = "Failed" ]; then
          KONCUR_STATUS_TEXT=":x:"
        else
          KONCUR_STATUS_TEXT="SKIPPED"
        fi

        # Construct Konflux UI link
        PIPELINE_LINK="https://konflux-ui.apps.kflux-ocp-p01.7ayg.p1.openshiftapps.com/ns/art-mta-tenant/applications/$APPLICATION_NAME/pipelineruns/$PIPELINE_RUN"

        # Construct message for Slack Workflow
        MESSAGE=$(cat <<EOF
        {
          "snapshot": "$SNAPSHOT_NAME",
          "nvr": "$OPERATOR_NVR",
          "ocp_version": "$OCP_VERSION",
          "ui_branch": "$TEST_BRANCH",
          "ui_tests": "$UI_STATUS_TEXT",
          "dast_scan": "$DAST_STATUS_TEXT",
          "koncur_tests": "$KONCUR_STATUS_TEXT",
          "pipeline": "$PIPELINE_LINK"
        }
        EOF
        )

        # Install curl if not already present
        if ! command -v curl &> /dev/null; then
          echo "Installing curl..."
          if ! microdnf install -y curl; then
            echo "❌ Failed to install curl"
            echo "FAILED" > $(results.slackStatus.path)
            exit 0
          fi
        fi

        # Send to Slack
        echo "Sending notification to Slack..."
        HTTP_CODE=$(curl -X POST -H 'Content-type: application/json' \
          --data "$MESSAGE" \
          -w "%{http_code}" \
          -o /tmp/slack-response.txt \
          "$SLACK_WEBHOOK_URL")

        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Slack notification sent successfully"
          echo "SENT" > $(results.slackStatus.path)
        else
          echo "⚠️ Failed to send Slack notification (HTTP $HTTP_CODE)"
          cat /tmp/slack-response.txt
          echo "FAILED" > $(results.slackStatus.path)
        fi
