apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: resolve-snapshot-from-nvr
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Utility
    tekton.dev/tags: konflux,snapshot,nvr
    tekton.dev/displayName: "Resolve Snapshot from NVR or Name"
spec:
  description: >-
    Resolves a Konflux snapshot from NVR, snapshot name, or gets latest snapshot.
    Supports flexible input: NVR string, snapshot name, or empty for latest.

  params:
    - name: nvrOrSnapshot
      type: string
      default: ""
      description: NVR, snapshot name, or empty for latest snapshot
    - name: namespace
      type: string
      default: "art-mta-tenant"
      description: Namespace containing snapshots

  results:
    - name: snapshotName
      description: Resolved snapshot name
    - name: snapshotJson
      description: Full snapshot JSON
    - name: operatorNVR
      description: Operator NVR from snapshot
    - name: application
      description: Auto-derived application name

  steps:
    - name: resolve
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/bash
        set -euo pipefail

        # Install jq if not available
        if command -v jq &> /dev/null; then
          JQ="jq"
        else
          curl -sL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o /tmp/jq
          chmod +x /tmp/jq
          JQ="/tmp/jq"
        fi

        INPUT="$(params.nvrOrSnapshot)"
        NS="$(params.namespace)"

        echo "======================================"
        echo "Resolving Snapshot"
        echo "======================================"
        echo "Input: ${INPUT:-<empty - will use latest>}"
        echo ""

        # Auto-derive application name from input
        if [ -z "$INPUT" ]; then
          # No input - default to fbc-mta-8-3
          APP="fbc-mta-8-3"
          echo "📋 No input provided - using default application: $APP"

        elif [[ "$INPUT" == *"mta-operator-container"* ]]; then
          # NVR detected - extract version and construct app name
          # Example: mta-operator-container-8.4.0.202610191234... → 8.4 → fbc-mta-8-4
          VERSION=$(echo "$INPUT" | grep -oP 'mta-operator-container-\K[0-9]+\.[0-9]+')
          APP="fbc-mta-${VERSION//./-}"
          echo "📋 NVR detected - derived application: $APP (version: $VERSION)"

        elif [[ "$INPUT" == fbc-mta-* ]]; then
          # Snapshot name - extract app name from prefix
          # Example: fbc-mta-8-3-20261019-123456-000 → fbc-mta-8-3
          APP=$(echo "$INPUT" | grep -oP '^fbc-mta-[0-9]+-[0-9]+')
          echo "📋 Snapshot name detected - derived application: $APP"

        else
          # Unknown format - default to fbc-mta-8-3
          APP="fbc-mta-8-3"
          echo "⚠️  Unknown input format - using default application: $APP"
        fi

        echo "Application: $APP"
        echo "Namespace: $NS"
        echo ""

        # Case 1: No input - get latest snapshot
        if [ -z "$INPUT" ]; then
          echo "No input provided - getting latest snapshot for $APP"

          SNAPSHOT=$(oc get snapshot -n "$NS" \
            -l appstudio.openshift.io/application="$APP" \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1].metadata.name}')

          if [ -z "$SNAPSHOT" ]; then
            echo "❌ No snapshots found for application: $APP"
            exit 1
          fi

          echo "✅ Latest snapshot: $SNAPSHOT"

        # Case 2: Input looks like NVR (contains "mta-operator-container")
        elif [[ "$INPUT" == *"mta-operator-container"* ]]; then
          echo "NVR detected: $INPUT"
          echo "Searching for snapshot containing this NVR..."

          # Search snapshots for matching NVR in operator-container component
          SNAPSHOT=$(oc get snapshot -n "$NS" \
            -l appstudio.openshift.io/application="$APP" \
            -o json | \
            $JQ -r --arg nvr "$INPUT" '
              .items[] |
              select(
                .spec.components[] |
                select(.name | endswith("-mta-operator-container")) |
                .containerImage | contains($nvr)
              ) |
              .metadata.name
            ' | head -1)

          if [ -z "$SNAPSHOT" ]; then
            echo "❌ No snapshot found containing NVR: $INPUT"
            echo ""
            echo "Available recent snapshots:"
            oc get snapshot -n "$NS" \
              -l appstudio.openshift.io/application="$APP" \
              --sort-by=.metadata.creationTimestamp \
              -o jsonpath='{range .items[-5:]}{.metadata.name}{"\n"}{end}'
            exit 1
          fi

          echo "✅ Found snapshot: $SNAPSHOT"

        # Case 3: Assume it's a snapshot name
        else
          echo "Snapshot name provided: $INPUT"
          SNAPSHOT="$INPUT"

          # Verify it exists
          if ! oc get snapshot "$SNAPSHOT" -n "$NS" &>/dev/null; then
            echo "❌ Snapshot not found: $SNAPSHOT"
            exit 1
          fi

          echo "✅ Snapshot exists: $SNAPSHOT"
        fi

        # Get full snapshot JSON
        echo ""
        echo "Fetching snapshot details..."
        SNAPSHOT_JSON=$(oc get snapshot "$SNAPSHOT" -n "$NS" -o json)

        # Extract operator NVR from components
        # Component name pattern: fbc-mta-X-Y-mta-operator-container
        OPERATOR_IMAGE=$(echo "$SNAPSHOT_JSON" | $JQ -r '
          .spec.components[] |
          select(.name | endswith("-mta-operator-container")) |
          .containerImage
        ')

        if [ -z "$OPERATOR_IMAGE" ]; then
          echo "⚠️  WARNING: No component ending with -mta-operator-container found!"
          OPERATOR_NVR="unknown"
        else
          # Extract NVR from image (format: registry/path/name:nvr@sha256:...)
          OPERATOR_NVR=$(echo "$OPERATOR_IMAGE" | sed 's/@sha256.*//' | sed 's/.*://')
        fi

        # Save results
        echo -n "$SNAPSHOT" > $(results.snapshotName.path)
        echo "$SNAPSHOT_JSON" > $(results.snapshotJson.path)
        echo -n "$OPERATOR_NVR" > $(results.operatorNVR.path)
        echo -n "$APP" > $(results.application.path)

        echo ""
        echo "======================================"
        echo "Resolution Complete"
        echo "======================================"
        echo "Snapshot: $SNAPSHOT"
        echo "Operator NVR: $OPERATOR_NVR"
        echo "Application: $APP"
        echo "======================================"
