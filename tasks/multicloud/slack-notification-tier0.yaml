apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slack-notification-tier0
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Notification
    tekton.dev/tags: slack,notification,multicloud,tier0
    tekton.dev/displayName: "Send Slack Notification for Multicloud Tier-0 Tests"
spec:
  description: >-
    Send multicloud tier-0 test results notification to Slack channel.
    Works for ARO, ROSA, ROSA-STS, and OCP-AWS clusters.

  params:
    - name: testStatus
      type: string
      description: Test execution status (Succeeded/Failed)
    - name: clusterType
      type: string
      description: Cluster type (aro, rosa, rosa-sts, ocp-aws)
    - name: clusterTypeLabel
      type: string
      description: Human-readable cluster type label
    - name: snapshotName
      type: string
      description: Snapshot name tested
    - name: operatorNVR
      type: string
      description: Operator NVR tested
    - name: clusterId
      type: string
      description: Cluster ID
    - name: pipelineRunName
      type: string
      description: Name of the pipeline run
    - name: triggeredBy
      type: string
      default: "unknown"
      description: User who triggered the test
    - name: slackWebhookSecretName
      type: string
      default: "slack-webhook-upgrade"
      description: Name of the Kubernetes Secret containing Slack webhook URL
    - name: slackWebhookSecretKey
      type: string
      default: "url"
      description: Key in the secret containing the webhook URL

  steps:
    - name: send-notification
      image: registry.access.redhat.com/ubi9/ubi:9.5
      env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: $(params.slackWebhookSecretName)
              key: $(params.slackWebhookSecretKey)
      script: |
        #!/bin/bash
        set -euo pipefail

        TEST_STATUS="$(params.testStatus)"
        CLUSTER_TYPE="$(params.clusterType)"
        CLUSTER_TYPE_LABEL="$(params.clusterTypeLabel)"
        SNAPSHOT="$(params.snapshotName)"
        OPERATOR_NVR="$(params.operatorNVR)"
        CLUSTER_ID="$(params.clusterId)"
        PIPELINE_RUN="$(params.pipelineRunName)"
        TRIGGERED_BY="$(params.triggeredBy)"

        echo "Sending Slack notification for multicloud tier-0 test"
        echo "Cluster Type: $CLUSTER_TYPE ($CLUSTER_TYPE_LABEL)"
        echo "Status: $TEST_STATUS"
        echo "Snapshot: $SNAPSHOT"
        echo "Operator NVR: $OPERATOR_NVR"
        echo "Cluster: $CLUSTER_ID"
        echo "Triggered by: $TRIGGERED_BY"

        # Determine status emoji
        if [ "$TEST_STATUS" = "Succeeded" ]; then
          STATUS_EMOJI=":white_check_mark:"
          STATUS_TEXT="PASSED"
        else
          STATUS_EMOJI=":x:"
          STATUS_TEXT="FAILED"
        fi

        # Construct Konflux UI link
        PIPELINE_LINK="https://konflux-ui.apps.kflux-ocp-p01.7ayg.p1.openshiftapps.com/ns/art-mta-tenant/pipelineruns/$PIPELINE_RUN"

        # Construct message for Slack Workflow
        MESSAGE=$(cat <<EOF
        {
          "snapshot": "$SNAPSHOT",
          "nvr": "$OPERATOR_NVR",
          "cluster_type": "$CLUSTER_TYPE_LABEL",
          "test_status": "$STATUS_EMOJI $STATUS_TEXT",
          "triggered_by": "$TRIGGERED_BY",
          "pipeline": "$PIPELINE_LINK"
        }
        EOF
        )

        # Install curl if not present
        if ! command -v curl &> /dev/null; then
          echo "Installing curl..."
          microdnf install -y curl
        fi

        # Send to Slack
        echo "Sending notification to Slack..."
        HTTP_CODE=$(curl -X POST -H 'Content-type: application/json' \
          --data "$MESSAGE" \
          -w "%{http_code}" \
          -o /tmp/slack-response.txt \
          "$SLACK_WEBHOOK_URL")

        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Slack notification sent successfully"
        else
          echo "⚠️ Failed to send Slack notification (HTTP $HTTP_CODE)"
          cat /tmp/slack-response.txt
        fi
