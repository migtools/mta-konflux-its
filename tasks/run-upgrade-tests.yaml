apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-upgrade-tests
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Test
    tekton.dev/tags: cypress,e2e,ui,mta,upgrade
    tekton.dev/displayName: "Run MTA Upgrade Tests"
spec:
  description: >-
    Run Cypress E2E tests for upgrade scenarios.
    Supports pre-upgrade and post-upgrade test markers.

  params:
    - name: uiRoute
      type: string
      description: MTA UI route (hostname only, without https://)
    - name: gitRepository
      type: string
      default: "https://github.com/migtools/mta-tackle2-ui.git"
      description: tackle2-ui repository URL
    - name: gitBranch
      type: string
      default: "main"
      description: Branch to clone for tests
    - name: testMarker
      type: string
      default: "pre-upgrade"
      description: Test marker to run (pre-upgrade or post-upgrade)
    - name: testTags
      type: string
      default: ""
      description: Comma-separated test tags to include (empty = run all tests matching marker only)
    - name: testCredentialsSecret
      type: string
      default: "test-credentials"
      description: Name of the secret containing test credentials (git-user, git-password)

  results:
    - name: testStatus
      description: Test execution status (PASSED or FAILED)
    - name: testMarker
      description: The marker that was run

  stepTemplate:
    computeResources:
      requests:
        memory: 4Gi
        cpu: "2"
      limits:
        memory: 8Gi
        cpu: "4"

  steps:
    - name: run-upgrade-tests
      image: cypress/included:16.2.0
      env:
        - name: CYPRESS_CACHE_FOLDER
          value: /tmp/.cache/Cypress
        - name: npm_config_cache
          value: /tmp/.cache/npm
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: CYPRESS_GIT_USER
          valueFrom:
            secretKeyRef:
              name: $(params.testCredentialsSecret)
              key: git-user
              optional: true
        - name: CYPRESS_GIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.testCredentialsSecret)
              key: git-password
              optional: true
      script: |
        #!/bin/bash
        set -euo pipefail

        echo "Installing curl and jq for test utilities..."
        apt-get update -qq && apt-get install -y -qq curl jq > /dev/null 2>&1

        UI_ROUTE="$(params.uiRoute)"
        BASE_URL="https://${UI_ROUTE}"
        TEST_MARKER="$(params.testMarker)"

        echo "======================================"
        echo "Running $TEST_MARKER Tests"
        echo "MTA UI URL: $BASE_URL"
        echo "======================================"

        echo -n "$TEST_MARKER" > $(results.testMarker.path)

        echo "Cloning tackle2-ui repository..."
        cd /tmp
        git clone --depth 1 --branch $(params.gitBranch) $(params.gitRepository)

        # Extract directory name from repository URL (e.g., mta-tackle2-ui.git -> mta-tackle2-ui)
        REPO_DIR=$(basename $(params.gitRepository) .git)
        cd "$REPO_DIR"

        echo "Installing dependencies..."
        npm clean-install --ignore-scripts --no-audit
        npx cypress install

        cd cypress
        cp .env.example .env

        echo "Marker: $TEST_MARKER"
        TEST_TAGS="$(params.testTags)"

        # Use findTierFiles.mjs to find spec files containing upgrade marker tags
        echo "Finding test files with @$TEST_MARKER tag..."
        if [ -z "$TEST_TAGS" ]; then
          # Default: find files with upgrade marker only
          SPEC_FILES=$(node scripts/findTierFiles.mjs "@$TEST_MARKER")
          CYPRESS_TAGS="@$TEST_MARKER"
        else
          # Find files with both tier tags and upgrade marker
          SPEC_FILES=$(node scripts/findTierFiles.mjs "$TEST_TAGS,@$TEST_MARKER")
          CYPRESS_TAGS="$TEST_TAGS,@$TEST_MARKER"
        fi

        if [ -z "$SPEC_FILES" ]; then
          echo "ERROR: No test files found with @$TEST_MARKER tag"
          echo -n "FAILED" > $(results.testStatus.path)
          echo -n "$TEST_MARKER" > $(results.testMarker.path)
          exit 0
        fi

        FILE_COUNT=$(echo "$SPEC_FILES" | tr ',' '\n' | wc -l)
        echo "Found $FILE_COUNT test files containing @$TEST_MARKER tests"

        # Set Cypress tag filter
        export CYPRESS_INCLUDE_TAGS="$CYPRESS_TAGS"
        echo "Cypress tags filter: $CYPRESS_INCLUDE_TAGS"

        echo "Starting Cypress $TEST_MARKER tests..."
        if npx dotenvx run -- npx cypress run \
          --spec "$SPEC_FILES" \
          --config-file cypress.config.ts \
          --config baseUrl="$BASE_URL",chromeWebSecurity=false,video=false; then
          echo "✅ $TEST_MARKER Tests PASSED"
          echo -n "PASSED" > $(results.testStatus.path)
        else
          echo "❌ $TEST_MARKER Tests FAILED"
          echo -n "FAILED" > $(results.testStatus.path)
        fi

        # Always exit 0 so the task succeeds and results are available to next tasks
        exit 0
