apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slack-notification-upgrade
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Notification
    tekton.dev/tags: slack,notification,upgrade
    tekton.dev/displayName: "Send Slack Notification for Upgrade"
spec:
  description: >-
    Send upgrade test results notification to Slack channel.
    Reports upgrade pipeline execution status, source/target versions, and test results.

  params:
    - name: sourceVersion
      type: string
      description: Source MTA version (e.g., "8.2.2")
    - name: targetVersion
      type: string
      description: Target MTA version (e.g., "8.2.3")
    - name: upgradeType
      type: string
      description: Upgrade type (Z_STREAM or Y_STREAM)
    - name: preUpgradeTestStatus
      type: string
      description: Pre-upgrade test execution status (Succeeded/Failed/Skipped)
    - name: upgradeStatus
      type: string
      description: Upgrade operation status (Succeeded/Failed)
    - name: postUpgradeTestStatus
      type: string
      description: Post-upgrade test execution status (Succeeded/Failed/Skipped)
    - name: operatorNVR
      type: string
      default: "unknown"
      description: Operator NVR (Name-Version-Release)
    - name: snapshotJson
      type: string
      description: Konflux snapshot JSON
    - name: pipelineRunName
      type: string
      description: Name of the pipeline run
    - name: testBranch
      type: string
      default: "main"
      description: Branch info used for tests (e.g., "pre:release-0.10 post:release-0.11")
    - name: slackWebhookSecretName
      type: string
      default: "slack-webhook-upgrade"
      description: Name of the Kubernetes Secret containing Slack webhook URL
    - name: slackWebhookSecretKey
      type: string
      default: "url"
      description: Key in the secret containing the webhook URL

  steps:
    - name: send-notification
      image: registry.access.redhat.com/ubi9/ubi:9.5
      env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: $(params.slackWebhookSecretName)
              key: $(params.slackWebhookSecretKey)
      script: |
        #!/bin/bash
        set -euo pipefail

        SOURCE_VERSION="$(params.sourceVersion)"
        TARGET_VERSION="$(params.targetVersion)"
        UPGRADE_TYPE="$(params.upgradeType)"
        PRE_UPGRADE_STATUS="$(params.preUpgradeTestStatus)"
        UPGRADE_STATUS="$(params.upgradeStatus)"
        POST_UPGRADE_STATUS="$(params.postUpgradeTestStatus)"
        OPERATOR_NVR="$(params.operatorNVR)"
        SNAPSHOT_JSON='$(params.snapshotJson)'
        PIPELINE_RUN="$(params.pipelineRunName)"
        TEST_BRANCH="$(params.testBranch)"

        # Install oc CLI (needed to get snapshot name and OCP version)
        if ! command -v oc &> /dev/null; then
          echo "Installing oc CLI..."
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz | tar -xzf - -C /usr/local/bin oc
          chmod +x /usr/local/bin/oc
        fi

        # Extract snapshot name from pipelineRun label
        SNAPSHOT_NAME=$(oc get pipelinerun "$PIPELINE_RUN" -o jsonpath='{.metadata.labels.appstudio\.openshift\.io/snapshot}' 2>/dev/null || true)

        # Fallback: use application name
        if [ -z "$SNAPSHOT_NAME" ]; then
          SNAPSHOT_NAME=$(echo "$SNAPSHOT_JSON" | grep -o '"application":"[^"]*"' | cut -d'"' -f4)
        fi

        # Last resort
        if [ -z "$SNAPSHOT_NAME" ]; then
          SNAPSHOT_NAME="unknown"
        fi

        # Extract application name from snapshot JSON for dynamic Konflux link
        APPLICATION_NAME=$(echo "$SNAPSHOT_JSON" | grep -o '"application":"[^"]*"' | cut -d'"' -f4)
        if [ -z "$APPLICATION_NAME" ]; then
          APPLICATION_NAME="unknown"
        fi

        # Extract OCP version from snapshot target_branch annotation
        OCP_VERSION="N/A"
        if [ "$SNAPSHOT_NAME" != "unknown" ]; then
          TARGET_BRANCH=$(oc get snapshot "$SNAPSHOT_NAME" \
            -o jsonpath='{.metadata.annotations.build\.appstudio\.redhat\.com/target_branch}' 2>/dev/null || echo "")

          if [ -n "$TARGET_BRANCH" ]; then
            # Extract OCP version (e.g., art-mta-8.2-ocp-4.20-... → 4.20)
            if echo "$TARGET_BRANCH" | grep -qE 'ocp-[0-9]+\.[0-9]+'; then
              OCP_VERSION=$(echo "$TARGET_BRANCH" | grep -oE 'ocp-[0-9]+\.[0-9]+' | sed 's/ocp-//')
            fi
          fi
        fi

        echo "Sending Slack notification for upgrade pipeline"
        echo "Snapshot: $SNAPSHOT_NAME"
        echo "Operator NVR: $OPERATOR_NVR"
        echo "OCP Version: $OCP_VERSION"
        echo "Upgrade: $SOURCE_VERSION → $TARGET_VERSION ($UPGRADE_TYPE)"
        echo "Pre-upgrade Tests: $PRE_UPGRADE_STATUS"
        echo "Upgrade Operation: $UPGRADE_STATUS"
        echo "Post-upgrade Tests: $POST_UPGRADE_STATUS"

        # Format upgrade type
        if [ "$UPGRADE_TYPE" = "Z_STREAM" ]; then
          UPGRADE_TYPE_TEXT="Z-stream"
        elif [ "$UPGRADE_TYPE" = "Y_STREAM" ]; then
          UPGRADE_TYPE_TEXT="Y-stream"
        else
          UPGRADE_TYPE_TEXT="$UPGRADE_TYPE"
        fi

        # Pre-upgrade test status - emoji for pass/fail, text for skipped
        if [ "$PRE_UPGRADE_STATUS" = "Succeeded" ]; then
          PRE_UPGRADE_TEXT=":white_check_mark:"
        elif [ "$PRE_UPGRADE_STATUS" = "Failed" ]; then
          PRE_UPGRADE_TEXT=":x:"
        else
          PRE_UPGRADE_TEXT="SKIPPED"
        fi

        # Upgrade operation status - emoji for pass/fail
        if [ "$UPGRADE_STATUS" = "Succeeded" ]; then
          UPGRADE_TEXT=":white_check_mark:"
        elif [ "$UPGRADE_STATUS" = "Failed" ]; then
          UPGRADE_TEXT=":x:"
        else
          UPGRADE_TEXT="SKIPPED"
        fi

        # Post-upgrade test status - emoji for pass/fail, text for skipped
        if [ "$POST_UPGRADE_STATUS" = "Succeeded" ]; then
          POST_UPGRADE_TEXT=":white_check_mark:"
        elif [ "$POST_UPGRADE_STATUS" = "Failed" ]; then
          POST_UPGRADE_TEXT=":x:"
        else
          POST_UPGRADE_TEXT="SKIPPED"
        fi

        # Construct Konflux UI link
        PIPELINE_LINK="https://konflux-ui.apps.kflux-ocp-p01.7ayg.p1.openshiftapps.com/ns/art-mta-tenant/applications/$APPLICATION_NAME/pipelineruns/$PIPELINE_RUN"

        # Construct message for Slack Workflow (simple JSON format)
        MESSAGE=$(cat <<EOF
        {
          "snapshot": "$SNAPSHOT_NAME",
          "nvr": "$OPERATOR_NVR",
          "ocp_version": "$OCP_VERSION",
          "source_version": "$SOURCE_VERSION",
          "target_version": "$TARGET_VERSION",
          "upgrade_type": "$UPGRADE_TYPE_TEXT",
          "test_branch": "$TEST_BRANCH",
          "pre_upgrade_tests": "$PRE_UPGRADE_TEXT",
          "upgrade_status": "$UPGRADE_TEXT",
          "post_upgrade_tests": "$POST_UPGRADE_TEXT",
          "pipeline": "$PIPELINE_LINK"
        }
        EOF
        )

        # Install curl if not already present
        if ! command -v curl &> /dev/null; then
          echo "Installing curl..."
          if ! microdnf install -y curl; then
            echo "❌ Failed to install curl"
            exit 1
          fi
        else
          echo "✓ curl already installed"
        fi

        # Send to Slack
        echo "Sending notification to Slack..."
        HTTP_CODE=$(curl -X POST -H 'Content-type: application/json' \
          --data "$MESSAGE" \
          -w "%{http_code}" \
          -o /tmp/slack-response.txt \
          "$SLACK_WEBHOOK_URL")

        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Slack notification sent successfully"
        else
          echo "⚠️ Failed to send Slack notification (HTTP $HTTP_CODE)"
          cat /tmp/slack-response.txt
        fi
