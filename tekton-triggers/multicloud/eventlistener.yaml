---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: mta-multicloud-tier0-trigger
  namespace: art-mta-tenant
spec:
  serviceAccountName: pipeline
  triggers:
    - name: slack-multicloud-tier0-trigger
      bindings:
        - ref: mta-multicloud-slack-binding
      template:
        ref: mta-multicloud-tier0-template

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: mta-multicloud-slack-binding
  namespace: art-mta-tenant
spec:
  params:
    - name: nvrOrSnapshot
      value: $(body.nvr_or_snapshot)
    - name: triggeredBy
      value: $(body.triggered_by)

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: mta-multicloud-tier0-template
  namespace: art-mta-tenant
spec:
  params:
    - name: nvrOrSnapshot
      default: ""
    - name: triggeredBy
      default: "slack-user"
  resourcetemplates:
    # ARO PipelineRun
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: mta-tier0-aro-
        namespace: art-mta-tenant
        labels:
          triggered-by: $(tt.params.triggeredBy)
          test-type: tier0
          cluster-type: aro
      spec:
        pipelineRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/migtools/mta-konflux-its
            - name: revision
              value: main
            - name: pathInRepo
              value: pipelines/multicloud/mta-tier0-pipeline.yaml
        params:
          - name: clusterType
            value: aro
          - name: nvrOrSnapshot
            value: $(tt.params.nvrOrSnapshot)
          - name: triggeredBy
            value: $(tt.params.triggeredBy)
        timeouts:
          pipeline: "4h"

    # ROSA PipelineRun
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: mta-tier0-rosa-
        namespace: art-mta-tenant
        labels:
          triggered-by: $(tt.params.triggeredBy)
          test-type: tier0
          cluster-type: rosa
      spec:
        pipelineRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/migtools/mta-konflux-its
            - name: revision
              value: main
            - name: pathInRepo
              value: pipelines/multicloud/mta-tier0-pipeline.yaml
        params:
          - name: clusterType
            value: rosa
          - name: nvrOrSnapshot
            value: $(tt.params.nvrOrSnapshot)
          - name: triggeredBy
            value: $(tt.params.triggeredBy)
        timeouts:
          pipeline: "4h"

    # ROSA-STS PipelineRun
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: mta-tier0-rosa-sts-
        namespace: art-mta-tenant
        labels:
          triggered-by: $(tt.params.triggeredBy)
          test-type: tier0
          cluster-type: rosa-sts
      spec:
        pipelineRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/migtools/mta-konflux-its
            - name: revision
              value: main
            - name: pathInRepo
              value: pipelines/multicloud/mta-tier0-pipeline.yaml
        params:
          - name: clusterType
            value: rosa-sts
          - name: nvrOrSnapshot
            value: $(tt.params.nvrOrSnapshot)
          - name: triggeredBy
            value: $(tt.params.triggeredBy)
        timeouts:
          pipeline: "4h"

    # OCP-AWS PipelineRun
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: mta-tier0-ocp-aws-
        namespace: art-mta-tenant
        labels:
          triggered-by: $(tt.params.triggeredBy)
          test-type: tier0
          cluster-type: ocp-aws
      spec:
        pipelineRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/migtools/mta-konflux-its
            - name: revision
              value: main
            - name: pathInRepo
              value: pipelines/multicloud/mta-tier0-pipeline.yaml
        params:
          - name: clusterType
            value: ocp-aws
          - name: nvrOrSnapshot
            value: $(tt.params.nvrOrSnapshot)
          - name: triggeredBy
            value: $(tt.params.triggeredBy)
        timeouts:
          pipeline: "4h"
